name: Sanitize Tech Stack SVG

on:
  push:
    branches: [main]
    paths:
      - "assets/moinaktar_tech_stack.svg"
      - ".github/workflows/sanitize-tech-stack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unsupported C2PA metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("assets/moinaktar_tech_stack.svg")
          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r"<metadata><c2pa:manifest>.*?</c2pa:manifest></metadata>",
              "",
              text,
              count=1,
              flags=re.DOTALL,
          )
          text = text.replace(' xmlns:c2pa="http://c2pa.org/manifest"', "")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit sanitized SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/moinaktar_tech_stack.svg
          git diff --cached --quiet || git commit -m "Sanitize Tech Stack SVG for GitHub rendering"
          git push
