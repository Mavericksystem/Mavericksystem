name: Update LeetCode Activity SVG

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-updates
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate LeetCode stats SVG
        run: node scripts/generate-leetcode-stats.mjs
      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/moinaktar_leetcode_activity_animated.svg
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update LeetCode activity stats"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
