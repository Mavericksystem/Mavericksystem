name: Update GitHub Activity SVG

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-github-stats.mjs"
      - ".github/workflows/update-github-stats.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: profile-updates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate stats SVG
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: Mavericksystem
        run: node scripts/generate-github-stats.mjs

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/moinaktar_github_activity_animated.svg assets/moinaktar_github_activity_animated_v2.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update GitHub activity stats"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
