<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1400 520"
     width="1400"
     height="520"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Moinaktar Shaikh — Personal Brand</title>
  <desc id="desc">A premium business technology personal-brand identity for Moinaktar Shaikh, AI Engineer and Backend Engineer.</desc>

  <defs>
    <!-- Brand palette: executive navy + restrained electric blue -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070A"/>
      <stop offset="58%" stop-color="#0A0C10"/>
      <stop offset="100%" stop-color="#12151A"/>
    </linearGradient>

    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8A06A"/>
      <stop offset="52%" stop-color="#8F7A4E"/>
      <stop offset="100%" stop-color="#6F5B38"/>
    </linearGradient>

    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2EFE7"/>
      <stop offset="72%" stop-color="#DDD8CC"/>
      <stop offset="100%" stop-color="#B8A06A"/>
    </linearGradient>

    <linearGradient id="lightSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2EFE7" stop-opacity="0"/>
      <stop offset="47%" stop-color="#F2EFE7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F2EFE7" stop-opacity=".85"/>
      <stop offset="53%" stop-color="#F2EFE7" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F2EFE7" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#8F7A4E" stop-opacity=".18"/>
      <stop offset="55%" stop-color="#6F5B38" stop-opacity=".045"/>
      <stop offset="100%" stop-color="#6F5B38" stop-opacity="0"/>
    </radialGradient>

    <pattern id="microGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#C5BFAF" stroke-opacity=".035"/>
    </pattern>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <!-- Wordmark reveal -->
    <clipPath id="wordReveal">
      <rect id="wordRevealRect" x="565" y="164" width="0" height="105" rx="4"/>
    </clipPath>

    <!-- Role reveal -->
    <clipPath id="roleReveal">
      <rect id="roleRevealRect" x="570" y="286" width="0" height="40" rx="3"/>
    </clipPath>

    <style>
      .name {
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
                     "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 72px;
        font-weight: 720;
        letter-spacing: -2.8px;
        fill: url(#wordmark);
      }

      .role {
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
                     "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 17px;
        font-weight: 560;
        letter-spacing: 4.8px;
        fill: #A69F91;
      }

      .meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 2.2px;
        fill: #756F63;
      }

      /* Mark: controlled, business-like assembly */
      #markRing {
        stroke-dasharray: 420;
        stroke-dashoffset: 420;
        animation: ringDraw 1.35s cubic-bezier(.22,1,.36,1) .1s forwards;
      }

      #markM {
        stroke-dasharray: 390;
        stroke-dashoffset: 390;
        animation: markDraw 1.45s cubic-bezier(.22,1,.36,1) .45s forwards;
      }

      #markS {
        stroke-dasharray: 330;
        stroke-dashoffset: 330;
        animation: markDraw 1.25s cubic-bezier(.22,1,.36,1) .75s forwards;
      }

      #markCore {
        opacity: 0;
        transform-origin: 300px 260px;
        animation: coreIn .65s cubic-bezier(.16,1,.3,1) 1.45s forwards;
      }

      #wordRevealRect {
        animation: revealWord 1.15s cubic-bezier(.16,1,.3,1) 1.35s forwards;
      }

      #roleRevealRect {
        animation: revealRole .85s cubic-bezier(.16,1,.3,1) 2.28s forwards;
      }

      #accent {
        transform-origin: 570px 342px;
        transform: scaleX(0);
        animation: lineIn .7s cubic-bezier(.16,1,.3,1) 2.95s forwards;
      }

      #halo {
        animation: haloPulse 5s ease-in-out 3s infinite;
      }

      #orbit {
        transform-origin: 300px 260px;
        animation: orbit 18s linear 2.6s infinite;
      }

      @keyframes ringDraw {
        to { stroke-dashoffset: 0; }
      }

      @keyframes markDraw {
        to { stroke-dashoffset: 0; }
      }

      @keyframes coreIn {
        0%   { opacity: 0; transform: scale(.35); }
        72%  { opacity: 1; transform: scale(1.08); }
        100% { opacity: .95; transform: scale(1); }
      }

      @keyframes revealWord {
        from { width: 0; }
        to   { width: 690px; }
      }

      @keyframes revealRole {
        from { width: 0; }
        to   { width: 600px; }
      }

      @keyframes lineIn {
        to { transform: scaleX(1); }
      }

      @keyframes haloPulse {
        0%, 100% { opacity: .65; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }

      @keyframes orbit {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #markRing, #markM, #markS, #markCore,
        #wordRevealRect, #roleRevealRect, #accent,
        #signal, #halo, #orbit {
          animation: none !important;
        }
        #markRing, #markM, #markS { stroke-dashoffset: 0 !important; }
        #markCore { opacity: .95 !important; transform: scale(1) !important; }
        #wordRevealRect { width: 690px !important; }
        #roleRevealRect { width: 600px !important; }
        #accent { transform: scaleX(1) !important; }
      }
    </style>
  </defs>

  <!-- Executive canvas -->
  <rect width="1400" height="520" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="520" rx="30" fill="url(#microGrid)"/>

  <!-- Restrained atmospheric depth -->
  <ellipse id="halo" cx="300" cy="260" rx="270" ry="220"
           fill="url(#halo)" filter="url(#softGlow)"/>

  <!-- Outer frame -->
  <rect x="28" y="28" width="1344" height="464" rx="24"
        fill="none" stroke="#C5BFAF" stroke-opacity=".12"/>

  <!-- Subtle technical guide lines -->
  <g opacity=".42" aria-hidden="true">
    <path d="M64 130H168 M1232 130H1336"
          stroke="#514E47" stroke-opacity=".22"/>
    <path d="M64 390H168 M1232 390H1336"
          stroke="#514E47" stroke-opacity=".22"/>
  </g>

  <!-- PERSONAL BRAND MARK -->
  <g aria-label="MS monogram">
    <!-- Precision circular frame -->
    <circle id="markRing" cx="300" cy="260" r="116"
            fill="none" stroke="url(#mark)" stroke-width="2.2"
            opacity=".9"/>

    <!-- Offset secondary ring -->
    <circle cx="300" cy="260" r="128"
            fill="none" stroke="#B8A06A" stroke-opacity=".09"
            stroke-width="1"/>

    <!-- MS monogram -->
    <path id="markM"
          d="M242 313V207
             L300 275
             L358 207V313"
          fill="none" stroke="url(#mark)" stroke-width="15"
          stroke-linecap="round" stroke-linejoin="round"/>

    <path id="markS"
          d="M337 216
             C327 204 312 198 296 198
             C270 198 251 211 251 231
             C251 251 267 259 299 268
             C330 276 349 285 349 304
             C349 324 330 337 304 337
             C284 337 266 330 254 317"
          fill="none" stroke="#DDD8CC" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"
          opacity=".9"/>

    <!-- Core signal -->
    <g id="markCore">
      <circle cx="300" cy="260" r="6" fill="#F2EFE7"/>
      <circle cx="300" cy="260" r="13" fill="none"
              stroke="#B8A06A" stroke-opacity=".35"/>
    </g>

    <!-- Small orbital indicator -->
    <g id="orbit">
      <circle cx="428" cy="260" r="3.5" fill="#B8A06A" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Brand divider -->
  <line x1="478" y1="168" x2="478" y2="350"
        stroke="#4E4B45" stroke-opacity=".18"/>

  <!-- Wordmark -->
  <g clip-path="url(#wordReveal)" aria-label="Moinaktar Shaikh">
    <text class="name" x="565" y="250">Moinaktar Shaikh</text>
  </g>

  <!-- Role -->
  <g clip-path="url(#roleReveal)" aria-label="AI Engineer Backend">
    <text class="role" x="570" y="314">AI ENGINEER • BACKEND</text>
  </g>

  <!-- Brand accent -->
  <line id="accent" x1="570" y1="343" x2="870" y2="343"
        stroke="url(#mark)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="870" cy="343" r="3" fill="#B8A06A" filter="url(#glow)"/>

  <!-- Right-side programmer identity: continuous coding animation -->
  <g id="signal" aria-label="Continuous programming typing animation">

    <text class="meta" x="1085" y="184"
          style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:16px;fill:#B8A06A">
      ~/moinaktar/backend
    </text>

    <!-- Continuous programming surface -->
    <g style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:16px">

      <!-- Code line 1 -->
      <text x="1085" y="215" fill="#B8A06A">
        <tspan>&gt; </tspan>
        <tspan fill="#F0ECE2">from ai import Agent</tspan>
      </text>

      <!-- Code line 2 -->
      <text x="1085" y="246" fill="#B8A06A">
        <tspan>&gt; </tspan>
        <tspan fill="#F0ECE2">class Backend:</tspan>
      </text>

      <!-- Code line 3 -->
      <text x="1085" y="277" fill="#B8A06A">
        <tspan>&gt; </tspan>
        <tspan fill="#9B907B">    def </tspan>
        <tspan fill="#F0ECE2">build_system</tspan>
        <tspan fill="#9B907B">():</tspan>
      </text>

      <!-- Code line 4 -->
      <text x="1085" y="308" fill="#B8A06A">
        <tspan>&gt; </tspan>
        <tspan fill="#9B907B">        return </tspan>
        <tspan fill="#C8BEA8">"AI infrastructure"</tspan>
      </text>

      <!-- Cursor / typing overlay -->
      <rect x="1100" y="202" width="9" height="17" rx="1"
            fill="#E6C878" opacity="0">
        <animate attributeName="opacity"
                 values="0;1;1;0;0"
                 keyTimes="0;.08;.45;.52;1"
                 dur="8.2s"
                 repeatCount="indefinite"/>

        <!-- Move continuously through the code surface -->
        <animate attributeName="x"
                 values="1100;1290;1100;1275;1100;1260;1100;1320;1100"
                 keyTimes="0;.16;.20;.36;.40;.58;.62;.80;1"
                 dur="8.2s"
                 repeatCount="indefinite"/>

        <animate attributeName="y"
                 values="202;202;233;233;264;264;295;295;202"
                 keyTimes="0;.16;.20;.36;.40;.58;.62;.80;1"
                 dur="8.2s"
                 repeatCount="indefinite"/>
      </rect>

      <!-- Soft programming glow / overlay -->
      <rect x="1068" y="194" width="315" height="128"
            rx="5" fill="none"
            stroke="#B8A06A" stroke-opacity=".12"
            stroke-width="1">
        <animate attributeName="stroke-opacity"
                 values=".06;.18;.06"
                 dur="4s"
                 repeatCount="indefinite"/>
      </rect>

      <!-- Active code signal -->
      <circle cx="1072" cy="184" r="3"
              fill="#E6C878">
        <animate attributeName="opacity"
                 values=".25;1;.25"
                 dur="1.8s"
                 repeatCount="indefinite"/>
      </circle>

      <!-- Continuous typing status -->
      <text x="1085" y="347"
            style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:11px;fill:#756F63">
        <tspan>&gt; </tspan><tspan fill="#C8BEA8">running...</tspan>
        <animate attributeName="opacity"
                 values=".35;1;.35"
                 dur="1.4s"
                 repeatCount="indefinite"/>
      </text>

    </g>
  </g>

  <!-- Footer positioning / brand code -->
  <text class="meta" x="70" y="452">MOINAKTAR SHAikh / 01</text>
  <text class="meta" x="1090" y="452">ENGINEERING • SYSTEMS • AI</text>
</svg>