<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="GitHub activity dashboard">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10232b"/><stop offset="1" stop-color="#3E606F"/></linearGradient>
<linearGradient id="chart" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#35d0b0" stop-opacity=".03"/><stop offset="1" stop-color="#35d0b0" stop-opacity=".38"/></linearGradient>
<style>
.h{font:700 25px Georgia,serif;fill:#FCFFF5;letter-spacing:3px}.n{font:700 30px Arial,sans-serif;fill:#FCFFF5}.l{font:500 11px Arial,sans-serif;fill:#a9c0c8;letter-spacing:2px}.s{font:11px Arial,sans-serif;fill:#8faab4}
</style>
</defs>
<rect width="1200" height="430" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="428" rx="21" fill="none" stroke="#FCFFF5" stroke-opacity=".12"/>
<text x="55" y="55" class="h">GITHUB ACTIVITY</text><circle cx="1070" cy="48" r="4" fill="#35d0b0"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle><text x="1085" y="53" class="s">LIVE</text>
<g fill="#07151b" fill-opacity=".32" stroke="#FCFFF5" stroke-opacity=".10"><rect x="45" y="82" width="245" height="82" rx="14"/><rect x="305" y="82" width="245" height="82" rx="14"/><rect x="565" y="82" width="245" height="82" rx="14"/><rect x="825" y="82" width="330" height="82" rx="14"/></g>
<text x="68" y="113" class="l">CONTRIBUTIONS</text><text x="68" y="148" class="n">1,284</text><text x="328" y="113" class="l">REPOSITORIES</text><text x="328" y="148" class="n">47</text><text x="588" y="113" class="l">STARS</text><text x="588" y="148" class="n">126</text><text x="848" y="113" class="l">CURRENT STREAK</text><text x="848" y="148" class="n">23 DAYS</text>
<rect x="45" y="190" width="765" height="195" rx="16" fill="#07151b" fill-opacity=".25" stroke="#FCFFF5" stroke-opacity=".10"/><text x="70" y="218" class="l">CONTRIBUTION FLOW</text>
<g stroke="#FCFFF5" stroke-opacity=".07"><line x1="70" y1="245" x2="785" y2="245"/><line x1="70" y1="285" x2="785" y2="285"/><line x1="70" y1="325" x2="785" y2="325"/><line x1="70" y1="365" x2="785" y2="365"/></g>
<path d="M70 350 C120 335 135 300 175 315 C220 332 230 270 275 285 C320 300 330 245 375 270 C420 295 445 255 485 275 C525 295 540 225 585 245 C625 265 650 285 690 245 C725 210 750 235 785 220 L785 365 L70 365Z" fill="url(#chart)"/>
<path d="M70 350 C120 335 135 300 175 315 C220 332 230 270 275 285 C320 300 330 245 375 270 C420 295 445 255 485 275 C525 295 540 225 585 245 C625 265 650 285 690 245 C725 210 750 235 785 220" fill="none" stroke="#35d0b0" stroke-width="3" stroke-linecap="round" stroke-dasharray="1200" stroke-dashoffset="1200"><animate attributeName="stroke-dashoffset" from="1200" to="0" dur="2.8s" repeatCount="indefinite"/></path>
<circle r="5" fill="#FCFFF5"><animateMotion dur="2.8s" repeatCount="indefinite" path="M70 350 C120 335 135 300 175 315 C220 332 230 270 275 285 C320 300 330 245 375 270 C420 295 445 255 485 275 C525 295 540 225 585 245 C625 265 650 285 690 245 C725 210 750 235 785 220"/></circle>
<rect x="830" y="190" width="325" height="195" rx="16" fill="#07151b" fill-opacity=".25" stroke="#FCFFF5" stroke-opacity=".10"/><text x="855" y="218" class="l">LANGUAGES</text>
<text x="855" y="252" class="s">Python</text><rect x="855" y="260" width="235" height="7" rx="4" fill="#21363d"/><rect x="855" y="260" width="190" height="7" rx="4" fill="#35d0b0"><animate attributeName="width" values="0;190;190" dur="1.4s" repeatCount="indefinite"/></rect>
<text x="855" y="292" class="s">Go</text><rect x="855" y="300" width="235" height="7" rx="4" fill="#21363d"/><rect x="855" y="300" width="145" height="7" rx="4" fill="#69e6c6"><animate attributeName="width" values="0;145;145" dur="1.4s" begin=".2s" repeatCount="indefinite"/></rect>
<text x="855" y="332" class="s">C++</text><rect x="855" y="340" width="235" height="7" rx="4" fill="#21363d"/><rect x="855" y="340" width="105" height="7" rx="4" fill="#9beed9"><animate attributeName="width" values="0;105;105" dur="1.4s" begin=".4s" repeatCount="indefinite"/></rect>
<text x="855" y="372" class="s">TypeScript</text><rect x="935" y="365" width="155" height="7" rx="4" fill="#21363d"/><rect x="935" y="365" width="70" height="7" rx="4" fill="#b9f5e7"><animate attributeName="width" values="0;70;70" dur="1.4s" begin=".6s" repeatCount="indefinite"/></rect>
</svg>